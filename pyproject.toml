[project]
name = "engineering-ci"
version = "0.6.8"
description = "Reusable Python CI/CD checks and release tooling"
readme = "README.md"
authors = [
    { name = "Aurora", email = "dyjane@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "transitions==0.9.3",
    "filelock==3.20.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
engineering-ci = "engineering_ci:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["**/AGENTS.md"]


[tool.uv.workspace]
members = [
    "tests/fixtures/python-app",
]
exclude = ["tests/fixtures/python-app"]



[tool.ruff]
target-version = "py311"
extend-exclude = [".dagger/sdk", ".test-tools", ".artifacts", ".log"]
