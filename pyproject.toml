[project]
name = "engineering-ci"
version = "0.5.3"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aurora", email = "dyjane@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "transitions==0.9.3",
    "filelock==3.20.3",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.0.3", "pytest-cov==7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
engineering-ci = "engineering_ci:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "tests/fixtures/python-app",
]
exclude = ["tests/fixtures/python-app"]


