[project]
name = "engineering-ci"
version = "0.7.0"
description = "Reusable Python CI/CD checks and release tooling"
readme = "README.md"
authors = [
    { name = "Aurora", email = "dyjane@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.70.0",
    "opentelemetry-proto>=1.45.0",
    "protobuf>=5.29.0",
]

[dependency-groups]
dev = [
    "lefthook==2.2.2",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "pytest-reportlog==1.0.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "fixtures",
    "*.egg",
    ".*",
    "build",
    "dist",
    "node_modules",
    "venv",
    "_darcs",
    "CVS",
    "{arch}",
]
pythonpath = ["src"]
# Native defaults; explicit CLI --durations/--durations-min still overrides these
# (the report plugin never rewrites native reporting options).
addopts = ["--durations=10", "--durations-min=0.05"]

[project.scripts]
engineering-ci = "engineering_ci:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engineering_ci"
wheel-exclude = ["**/AGENTS.md"]


[tool.uv.workspace]
members = [
    "tests/fixtures/python-app",
]
exclude = ["tests/fixtures/python-app"]



[tool.ruff]
# Package requires-python is >=3.14. target-version stays py311 so root Ruff also
# covers consumer/fixture trees that declare earlier minors (3.11+); syntax newer
# than 3.11 remains gated by those projects' own interpreters and CI matrices.
target-version = "py311"
extend-exclude = [
    ".dagger/sdk",
    ".dagger/.venv",
    ".test-tools",
    ".test-deps",
    ".artifacts",
    ".log",
    ".tmp",
    ".work",
    ".tools",
    ".weaver-74-probe",
    "dist",
    "build",
]

[tool.ruff.lint]
extend-select = ["B", "SIM", "PIE"]
