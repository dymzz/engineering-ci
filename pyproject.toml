[project]
name = "engineering-ci"
version = "0.6.7"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aurora", email = "dyjane@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "vesryn-log==0.1.0",
    "transitions==0.9.3",
    "filelock==3.20.3",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "vesryn[trace,mining,telemetry]==0.1.0",
    "cloudevents==2.2.0",
    "psycopg[binary]==3.3.6",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
engineering-ci = "engineering_ci:main"

[project.entry-points."vesryn.adapters"]
engineering-ci = "engineering_ci.workflow_adapters.checks:catalog"
engineering-ci-dagger = "engineering_ci.workflow_adapters.provider:catalog"

[project.optional-dependencies]
harness = ["vesryn==0.1.0"]
trace = [
    "vesryn-log[archive]==0.1.0",
    "vesryn[trace]==0.1.0",
]
mining = [
    "vesryn[mining]==0.1.0",
]
telemetry = [
    "vesryn[telemetry]==0.1.0",
]

[tool.uv.sources]
vesryn-log = { git = "https://github.com/dymzz/vesryn-log.git", rev = "030c5a8edf820588e29f53803b6baaf53b1f6e57" }
vesryn = { git = "https://github.com/dymzz/vesryn.git", rev = "fb984d44f84e1b4674ccb391746da14818de2bd4" }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
wheel-exclude = ["**/AGENTS.md"]


[tool.uv.workspace]
members = [
    "tests/fixtures/python-app",
]
exclude = ["tests/fixtures/python-app"]


