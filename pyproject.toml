[project]
name = "engineering-ci"
version = "0.7.0"
description = "Reusable Python CI/CD checks and release tooling"
readme = "README.md"
authors = [
    { name = "Aurora", email = "dyjane@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.70.0",
    "opentelemetry-proto>=1.45.0",
    "protobuf>=5.29.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
engineering-ci = "engineering_ci:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engineering_ci"
wheel-exclude = ["**/AGENTS.md"]


[tool.uv.workspace]
members = [
    "tests/fixtures/python-app",
]
exclude = ["tests/fixtures/python-app"]



[tool.ruff]
target-version = "py311"
extend-exclude = [".dagger/sdk", ".test-tools", ".artifacts", ".log"]
