[project]
name = "engineering-ci"
version = "0.6.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aurora", email = "dyjane@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "transitions==0.9.3",
    "filelock==3.20.3",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "cloudevents==2.2.0",
    "psycopg[binary]==3.3.6",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
engineering-ci = "engineering_ci:main"

[project.optional-dependencies]
trace = [
    "cloudevents==2.2.0",
    "opentelemetry-sdk==1.45.1",
    "psycopg[binary]==3.3.6",
]
mining = [
    "r4pm==0.6.2",
]
telemetry = [
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "tests/fixtures/python-app",
]
exclude = ["tests/fixtures/python-app"]


