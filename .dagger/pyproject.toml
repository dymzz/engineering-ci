[project]
name = "engineering-ci"
version = "0.6.1"
requires-python = ">=3.14"
dependencies = ["dagger-io", "packaging>=24.2"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
