name: Reusable Python CI

on:
  workflow_call:
    inputs:
      verify_failure_propagation:
        description: 'Run smoke-only Ruff negative and recovery checks'
        type: boolean
        required: false
        default: false
      verify_module_lock:
        description: 'Core release only: generate SDK and verify .dagger lock consistency'
        type: boolean
        required: false
        default: false
      dagger_environment:
        description: 'Optional native Dagger environment'
        type: string
        default: ''
      dagger_module:
        description: 'Optional Dagger Check module filter (not a module source)'
        type: string
        default: ''
      dagger_checks:
        description: 'Optional native Dagger check names, one exact name per line'
        type: string
        default: ''
      pytest_report_function:
        description: 'Opt-in Dagger function returning a python-test-artifacts Directory'
        type: string
        required: false
        default: ''
      pytest_check:
        description: 'Exact module-qualified pytest check replaced by the single report execution'
        type: string
        required: false
        default: ''
      pytest_report_scenario:
        description: 'Optional scenario argument, for engineering-ci report delivery probes only'
        type: string
        required: false
        default: ''
      pytest_artifact_name:
        description: 'Unique report artifact name when multiple reporting jobs share a run'
        type: string
        required: false
        default: pytest-report
      dependency_security_mode:
        description: 'Explicit dependency security mode: off, report, enforce'
        type: string
        required: false
        default: 'off'
      dependency_security_project:
        description: 'Repository-relative uv project to check and scan'
        type: string
        required: false
        default: '.'
      dependency_security_exceptions:
        description: 'Repository-relative native OSV exceptions TOML (finite ID exceptions only)'
        type: string
        required: false
        default: ''
      dependency_security_public_indexes:
        description: 'Explicit trusted public PyPI mirror URLs, one per line; no private sources'
        type: string
        required: false
        default: ''
      dependency_security_git_policy:
        description: 'Repository-relative exact Git repository/commit advisory scan policy; empty rejects Git sources'
        type: string
        required: false
        default: ''
      dependency_security_source_ref:
        description: 'Pinned engineering-ci helper ref; candidate SHA for pre-release validation'
        type: string
        required: false
        default: 'v0.4.7'
      dependency_security_artifact_name:
        description: 'Unique dependency security evidence artifact name'
        type: string
        required: false
        default: dependency-security
    secrets:
      ENGINEERING_CI_READ_TOKEN:
        required: false
    outputs:
      pytest_artifact_id:
        value: ${{ jobs.checks.outputs.artifact_id }}
      security_artifact_id:
        value: ${{ jobs.dependency-security.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  checks:
    outputs:
      artifact_id: ${{ steps.pytest_artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DAGGER_VERSION: '1.0.0-beta.16'

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure private Dagger module authentication
        shell: bash
        env:
          ENGINEERING_CI_READ_TOKEN: ${{ secrets.ENGINEERING_CI_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$ENGINEERING_CI_READ_TOKEN" ]]; then
            echo "No private module token supplied; skipping"
            exit 0
          fi

          umask 077
          cred_file="$RUNNER_TEMP/engineering-ci-git-credentials"

          git config --global credential.useHttpPath false
          git config --global credential.helper ""
          git config --global --add credential.helper \
            "store --file=$cred_file"

          printf 'protocol=https\nhost=github.com\nusername=x-access-token\npassword=%s\n\n' \
            "$ENGINEERING_CI_READ_TOKEN" | git credential approve

          GIT_TERMINAL_PROMPT=0 git ls-remote --symref \
            https://github.com/dymzz/engineering-ci HEAD > /dev/null

          echo "Private Dagger module Git authentication verified"

          # Test both credential lookup path formats.
          # Never print credential fill output.

          for path in "dymzz/engineering-ci" "/dymzz/engineering-ci"; do
            if printf 'protocol=https\nhost=github.com\npath=%s\n\n' "$path" |
                GIT_TERMINAL_PROMPT=0 GIT_ASKPASS= \
                git credential fill >/dev/null 2>&1; then
              echo "Credential lookup PASS: $path"
            else
              echo "::error::Credential lookup FAIL: $path"
              exit 1
            fi
          done

      - name: Start Dagger Engine
        shell: bash
        run: |
          set -euo pipefail

          docker pull "registry.dagger.io/engine:v$DAGGER_VERSION"
          docker volume create dagger-engine-data

          docker run -d \
            --name dagger-engine \
            --privileged \
            -v dagger-engine-data:/var/lib/dagger \
            "registry.dagger.io/engine:v$DAGGER_VERSION"

          docker ps --filter name=dagger-engine

      - name: Install Dagger CLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dagger-bin"

          curl -fsSL \
            https://dl.dagger.io/dagger/install.sh \
            -o "$RUNNER_TEMP/install-dagger.sh"

          BIN_DIR="$RUNNER_TEMP/dagger-bin" \
          sh "$RUNNER_TEMP/install-dagger.sh"

          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"

      - name: Run Dagger Checks
        shell: bash
        env:
          DAGGER_ENGINE: container://dagger-engine
          ENGINEERING_CI_READ_TOKEN: ${{ secrets.ENGINEERING_CI_READ_TOKEN }}
          DAGGER_ENVIRONMENT: ${{ inputs.dagger_environment }}
          ECI_CHECK_MODULE: ${{ inputs.dagger_module }}
          DAGGER_CHECKS: ${{ inputs.dagger_checks }}
          PYTEST_REPORT_FUNCTION: ${{ inputs.pytest_report_function }}
          PYTEST_CHECK: ${{ inputs.pytest_check }}
          PYTEST_REPORT_SCENARIO: ${{ inputs.pytest_report_scenario }}
          RECORD_RELEASE_EVIDENCE: ${{ inputs.verify_module_lock }}
        run: |
          set -euo pipefail

          if [[ "${RECORD_RELEASE_EVIDENCE:-false}" == 'true' ]]; then
            dagger version | tee "$RUNNER_TEMP/dagger-version.txt"
          else
            dagger version
          fi
          timed() {
            python3 - "$@" <<'TIMED_COMMAND'
          import json
          import subprocess
          import sys
          import time
          phase = sys.argv[1]
          started = time.perf_counter()
          result = subprocess.run(sys.argv[2:])
          print("CI_TIMING " + json.dumps({"phase": phase, "seconds": time.perf_counter() - started, "exit_code": result.returncode}), file=sys.stderr, flush=True)
          raise SystemExit(result.returncode if result.returncode >= 0 else 128 - result.returncode)
          TIMED_COMMAND
          }
          dagger_options=()
          check_options=()
          if [[ -n "${DAGGER_ENVIRONMENT:-}" ]]; then
            [[ "$DAGGER_ENVIRONMENT" =~ ^[a-z][a-z0-9-]*$ ]] || exit 1
            dagger_options+=(--env "$DAGGER_ENVIRONMENT")
          fi
          if [[ -n "${ECI_CHECK_MODULE:-}" ]]; then
            [[ "$ECI_CHECK_MODULE" =~ ^[a-z][a-z0-9-]*$ ]] || exit 1
            check_options+=(--module "$ECI_CHECK_MODULE")
          fi
          while IFS= read -r check_name; do
            [[ -n "$check_name" ]] || continue
            [[ "$check_name" =~ ^[a-z][a-z0-9-]*$ ]] || exit 1
            check_options+=(--check="$check_name")
          done <<< "${DAGGER_CHECKS:-}"
          if [[ -z "$PYTEST_REPORT_FUNCTION" ]]; then
            if [[ -n "$PYTEST_CHECK" || -n "$PYTEST_REPORT_SCENARIO" ]]; then
              echo "::error::pytest report settings require pytest_report_function"
              exit 1
            fi
            timed check-list dagger "${dagger_options[@]}" check "${check_options[@]}" -l --format cli > "$RUNNER_TEMP/dagger-checks.txt"
            cat "$RUNNER_TEMP/dagger-checks.txt"
            if [[ ! -s "$RUNNER_TEMP/dagger-checks.txt" ]]; then
              echo "::error::No native Dagger Checks matched the requested selectors"
              exit 1
            fi
            timed all-checks dagger "${dagger_options[@]}" check "${check_options[@]}"
          else
            if [[ ! "$PYTEST_REPORT_FUNCTION" =~ ^[a-z][a-z0-9-]*$ || -z "$PYTEST_CHECK" ]]; then
              echo "::error::Opt-in reporting requires a function and exact pytest_check name"
              exit 1
            fi
            report_args=(api call "$PYTEST_REPORT_FUNCTION")
            if [[ -n "$PYTEST_REPORT_SCENARIO" ]]; then
              report_args+=(--scenario "$PYTEST_REPORT_SCENARIO")
            fi
            timed report-export dagger "${dagger_options[@]}" "${report_args[@]}" export --path "$RUNNER_TEMP/pytest-report"
            timed check-list dagger "${dagger_options[@]}" check "${check_options[@]}" -l --format cli > "$RUNNER_TEMP/dagger-checks.txt"
            cat "$RUNNER_TEMP/dagger-checks.txt"
            python3 "$RUNNER_TEMP/pytest-report/ci.py" plan \
              "$RUNNER_TEMP/dagger-checks.txt" "$PYTEST_CHECK" "$RUNNER_TEMP/remaining-checks.txt" \
              --selectors "$RUNNER_TEMP/remaining-selectors.txt"
            mapfile -t remaining < "$RUNNER_TEMP/remaining-selectors.txt"
            if [[ "${RECORD_RELEASE_EVIDENCE:-false}" == 'true' ]]; then
              cp "$RUNNER_TEMP/dagger-version.txt" "$RUNNER_TEMP/dagger-checks.txt" \
                "$RUNNER_TEMP/remaining-checks.txt" "$RUNNER_TEMP/pytest-report/"
            fi
            if [[ "${#remaining[@]}" -gt 0 ]]; then
              timed remaining-checks dagger "${dagger_options[@]}" check "${remaining[@]}"
            fi
          fi

      - name: Gate on pytest execution and explicit quality policy
        if: ${{ always() && !cancelled() && inputs.pytest_report_function != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/pytest-report/ci.py" ]]; then
            echo "::error::Pytest execution evidence unavailable; bundle export did not complete"
            exit 1
          fi
          python3 "$RUNNER_TEMP/pytest-report/ci.py" gate "$RUNNER_TEMP/pytest-report"

      - name: Publish pytest Job Summary
        id: pytest_summary
        if: ${{ always() && !cancelled() && inputs.pytest_report_function != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/pytest-report/ci.py" ]]; then
            printf '## Pytest Results — UNAVAILABLE\n\nExecution evidence unavailable; bundle export failed. See execution logs.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 "$RUNNER_TEMP/pytest-report/ci.py" summary \
            "$RUNNER_TEMP/pytest-report" "$GITHUB_STEP_SUMMARY"

      - name: Explain pytest report delivery warning
        if: ${{ always() && !cancelled() && steps.pytest_summary.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "::warning::Pytest report delivery was unavailable; original execution gate remains authoritative"
          printf '\nReport delivery warning: evidence or presentation is incomplete. Original pytest execution status is unchanged.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest evidence
        id: pytest_artifact
        if: ${{ always() && !cancelled() && inputs.pytest_report_function != '' }}
        uses: actions/upload-artifact@v7.0.2
        continue-on-error: true
        with:
          name: ${{ inputs.pytest_artifact_name }}
          path: |
            ${{ runner.temp }}/pytest-report/report.json
            ${{ runner.temp }}/pytest-report/exit-code.txt
            ${{ runner.temp }}/pytest-report/summary.md
            ${{ runner.temp }}/pytest-report/junit.xml
            ${{ runner.temp }}/pytest-report/fixture-invocations.txt
            ${{ runner.temp }}/pytest-report/dagger-version.txt
            ${{ runner.temp }}/pytest-report/dagger-checks.txt
            ${{ runner.temp }}/pytest-report/remaining-checks.txt
            ${{ runner.temp }}/pytest-report/fixture-timing.json
            ${{ runner.temp }}/pytest-report/quality-policy.json
            ${{ runner.temp }}/pytest-report/coverage.xml
            ${{ runner.temp }}/pytest-report/coverage.json
            ${{ runner.temp }}/pytest-report/matrix.json
            ${{ runner.temp }}/pytest-report/matrix-policy.json
            ${{ runner.temp }}/pytest-report/matrix-benchmark.json
            ${{ runner.temp }}/pytest-report/versions/*/execution.json
            ${{ runner.temp }}/pytest-report/versions/*/runtime.json
            ${{ runner.temp }}/pytest-report/versions/*/exit-code.txt
            ${{ runner.temp }}/pytest-report/versions/*/report.json
            ${{ runner.temp }}/pytest-report/versions/*/summary.md
            ${{ runner.temp }}/pytest-report/versions/*/junit.xml
            ${{ runner.temp }}/pytest-report/versions/*/quality-policy.json
            ${{ runner.temp }}/pytest-report/versions/*/coverage.xml
            ${{ runner.temp }}/pytest-report/versions/*/coverage.json
            ${{ runner.temp }}/pytest-report/versions/*/fixture-invocations.txt
            ${{ runner.temp }}/pytest-report/versions/*/fixture-timing.json
            ${{ runner.temp }}/pytest-report/benchmarks/*/exit-code.txt
            ${{ runner.temp }}/pytest-report/benchmarks/*/report.json
            ${{ runner.temp }}/pytest-report/benchmarks/*/fixture-invocations.txt
            ${{ runner.temp }}/pytest-report/benchmarks/*/versions/*/runtime.json
            ${{ runner.temp }}/pytest-report/benchmarks/*/versions/*/execution.json
            ${{ runner.temp }}/pytest-report/benchmarks/*/versions/*/fixture-invocations.txt
            ${{ runner.temp }}/pytest-report/benchmarks/*/versions/*/fixture-timing.json
          if-no-files-found: warn
          retention-days: 7

      - uses: astral-sh/setup-uv@v7
        if: inputs.verify_module_lock
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Verify generated module lock consistency
        if: inputs.verify_module_lock
        shell: bash
        env:
          DAGGER_ENGINE: container://dagger-engine
        run: |
          set -euo pipefail
          dagger api call --no-load-module module-source --ref-string . \
            generated-context-directory directory --path .dagger export --path .dagger
          uv lock --project .dagger --check
      - name: Verify Ruff rejection and recovery (smoke only)
        if: ${{ inputs.verify_failure_propagation }}
        shell: bash
        env:
          DAGGER_ENGINE: container://dagger-engine
        run: |
          set -euo pipefail

          probe="tests/ruff_negative_probe.py"
          log="$RUNNER_TEMP/dagger-ruff-negative.log"

          if [[ ! -d tests || -e "$probe" ]]; then
            echo "::error::Smoke test directory missing or probe already exists"
            exit 1
          fi

          cleanup() {
            rm -f -- "$probe"
          }
          trap cleanup EXIT

          # Do not commit intentionally invalid code to Git.
          printf 'import os\n' > "$probe"

          status=0
          dagger check --check=lint > "$log" 2>&1 || status=$?

          if [[ "$status" -eq 0 ]]; then
            echo "::error::Ruff negative probe was incorrectly accepted"
            exit 1
          fi
          if ! grep -q 'F401' "$log" || ! grep -q 'ruff_negative_probe.py' "$log"; then
            echo "::error::Dagger failed, but not because of the expected Ruff F401 probe"
            tail -n 35 "$log"
            exit 1
          fi

          echo "PASS: Dagger rejected the injected Ruff F401"
          cleanup
          trap - EXIT

          # The same checkout must be healthy again after removing the probe.
          dagger check
          echo "PASS: All checks recovered after probe cleanup"

      - name: Engine logs on failure
        if: failure()
        run: docker logs --tail 100 dagger-engine || true

      - name: Cleanup temporary Git credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/engineering-ci-git-credentials"

  dependency-security:
    outputs:
      artifact_id: ${{ steps.security_artifact.outputs.artifact-id }}
    if: ${{ inputs.dependency_security_mode != 'off' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout dependency scan target
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Checkout matching security helper
        uses: actions/checkout@v7.0.1
        with:
          repository: dymzz/engineering-ci
          ref: ${{ inputs.dependency_security_source_ref }}
          path: .engineering-ci-security
          token: ${{ secrets.ENGINEERING_CI_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Cache verified scanner binary
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/engineering-ci-security-bin
          key: osv-scanner-v2.6.0-linux-amd64-ca69b3d3cd08f889
      - name: Check lock integrity and scan known vulnerabilities
        shell: bash
        env:
          SECURITY_MODE: ${{ inputs.dependency_security_mode }}
          SECURITY_PROJECT: ${{ inputs.dependency_security_project }}
          SECURITY_PUBLIC_INDEXES: ${{ inputs.dependency_security_public_indexes }}
          SECURITY_EXCEPTIONS: ${{ inputs.dependency_security_exceptions }}
          SECURITY_GIT_POLICY: ${{ inputs.dependency_security_git_policy }}
        run: |
          set -euo pipefail
          mv -- .engineering-ci-security "$RUNNER_TEMP/engineering-ci-security"
          args=(--project "$GITHUB_WORKSPACE/$SECURITY_PROJECT"
                --mode "$SECURITY_MODE"
                --out "$RUNNER_TEMP/dependency-security"
                --cache "$RUNNER_TEMP/engineering-ci-security-bin"
                --workspace-root "$GITHUB_WORKSPACE")
          if [[ -n "$SECURITY_EXCEPTIONS" ]]; then
            args+=(--exceptions "$GITHUB_WORKSPACE/$SECURITY_EXCEPTIONS")
          fi
          if [[ -n "$SECURITY_GIT_POLICY" ]]; then
            args+=(--git-policy "$GITHUB_WORKSPACE/$SECURITY_GIT_POLICY")
          fi
          while IFS= read -r index; do
            if [[ -n "$index" ]]; then
              args+=(--public-index "$index")
            fi
          done <<< "$SECURITY_PUBLIC_INDEXES"
          # Published helpers before v0.4.11 still expose the original script.
          # Select by entry availability; never retry another entry after a failure.
          if [[ -f "$RUNNER_TEMP/engineering-ci-security/src/engineering_ci/workflow_actions.py" ]]; then
            PYTHONPATH="$RUNNER_TEMP/engineering-ci-security/src" python3 -m engineering_ci.workflow_actions security "${args[@]}"
          else
            python3 "$RUNNER_TEMP/engineering-ci-security/scripts/dependency_security.py" "${args[@]}"
          fi
      - name: Publish Dependency Security Summary
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/dependency-security/summary.md" ]]; then
            cat "$RUNNER_TEMP/dependency-security/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## Dependency Security Summary\n\nEvidence unavailable. See failed setup or execution step; no security pass is established.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload dependency security evidence
        id: security_artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        continue-on-error: true
        with:
          name: ${{ inputs.dependency_security_artifact_name }}
          path: |
            ${{ runner.temp }}/dependency-security/report.json
            ${{ runner.temp }}/dependency-security/scanner.json
            ${{ runner.temp }}/dependency-security/diagnostics.json
            ${{ runner.temp }}/dependency-security/summary.md
          if-no-files-found: warn
          retention-days: 7
