name: Reusable Python CI

on:
  workflow_call:
    inputs:
      verify_failure_propagation:
        description: 'Run smoke-only Ruff negative and recovery checks'
        type: boolean
        required: false
        default: false
      pytest_report_function:
        description: 'Opt-in Dagger function returning a python-test-artifacts Directory'
        type: string
        required: false
        default: ''
      pytest_check:
        description: 'Exact module-qualified pytest check replaced by the single report execution'
        type: string
        required: false
        default: ''
      pytest_report_scenario:
        description: 'Optional scenario argument, for engineering-ci report delivery probes only'
        type: string
        required: false
        default: ''
      pytest_artifact_name:
        description: 'Unique report artifact name when multiple reporting jobs share a run'
        type: string
        required: false
        default: pytest-report
    secrets:
      ENGINEERING_CI_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Configure private Dagger module authentication
        shell: bash
        env:
          ENGINEERING_CI_READ_TOKEN: ${{ secrets.ENGINEERING_CI_READ_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$ENGINEERING_CI_READ_TOKEN" ]]; then
            echo "No private module token supplied; skipping"
            exit 0
          fi

          umask 077
          cred_file="$RUNNER_TEMP/engineering-ci-git-credentials"

          git config --global credential.useHttpPath false
          git config --global credential.helper ""
          git config --global --add credential.helper \
            "store --file=$cred_file"

          printf 'protocol=https\nhost=github.com\nusername=x-access-token\npassword=%s\n\n' \
            "$ENGINEERING_CI_READ_TOKEN" | git credential approve

          GIT_TERMINAL_PROMPT=0 git ls-remote --symref \
            https://github.com/dymzz/engineering-ci HEAD > /dev/null

          echo "Private Dagger module Git authentication verified"

          # Test both credential lookup path formats.
          # Never print credential fill output.

          for path in "dymzz/engineering-ci" "/dymzz/engineering-ci"; do
            if printf 'protocol=https\nhost=github.com\npath=%s\n\n' "$path" |
                GIT_TERMINAL_PROMPT=0 GIT_ASKPASS= \
                git credential fill >/dev/null 2>&1; then
              echo "Credential lookup PASS: $path"
            else
              echo "::error::Credential lookup FAIL: $path"
              exit 1
            fi
          done

      - name: Start Dagger Engine
        shell: bash
        run: |
          set -euo pipefail

          docker pull ghcr.io/dagger/engine:v0.21.10
          docker volume create dagger-engine-data

          docker run -d \
            --name dagger-engine \
            --privileged \
            -v dagger-engine-data:/var/lib/dagger \
            ghcr.io/dagger/engine:v0.21.10

          docker ps --filter name=dagger-engine

      - name: Install Dagger CLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dagger-bin"

          curl -fsSL \
            https://dl.dagger.io/dagger/install.sh \
            -o "$RUNNER_TEMP/install-dagger.sh"

          DAGGER_VERSION=0.21.10 \
          BIN_DIR="$RUNNER_TEMP/dagger-bin" \
          sh "$RUNNER_TEMP/install-dagger.sh"

          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"

      - name: Run Dagger Checks
        shell: bash
        env:
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine
          PYTEST_REPORT_FUNCTION: ${{ inputs.pytest_report_function }}
          PYTEST_CHECK: ${{ inputs.pytest_check }}
          PYTEST_REPORT_SCENARIO: ${{ inputs.pytest_report_scenario }}
        run: |
          set -euo pipefail

          dagger version
          if [[ -z "$PYTEST_REPORT_FUNCTION" ]]; then
            if [[ -n "$PYTEST_CHECK" || -n "$PYTEST_REPORT_SCENARIO" ]]; then
              echo "::error::pytest report settings require pytest_report_function"
              exit 1
            fi
            dagger check -l
            dagger check
          else
            if [[ ! "$PYTEST_REPORT_FUNCTION" =~ ^[a-z][a-z0-9-]*$ || -z "$PYTEST_CHECK" ]]; then
              echo "::error::Opt-in reporting requires a function and exact pytest_check name"
              exit 1
            fi
            report_args=(call "$PYTEST_REPORT_FUNCTION")
            if [[ -n "$PYTEST_REPORT_SCENARIO" ]]; then
              report_args+=(--scenario "$PYTEST_REPORT_SCENARIO")
            fi
            dagger "${report_args[@]}" export --path "$RUNNER_TEMP/pytest-report"
            dagger check -l > "$RUNNER_TEMP/dagger-checks.txt"
            cat "$RUNNER_TEMP/dagger-checks.txt"
            python3 "$RUNNER_TEMP/pytest-report/ci.py" plan \
              "$RUNNER_TEMP/dagger-checks.txt" "$PYTEST_CHECK" "$RUNNER_TEMP/remaining-checks.txt"
            mapfile -t remaining < "$RUNNER_TEMP/remaining-checks.txt"
            if [[ "${#remaining[@]}" -gt 0 ]]; then
              dagger check "${remaining[@]}"
            fi
          fi

      - name: Gate on original pytest execution
        if: ${{ always() && !cancelled() && inputs.pytest_report_function != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/pytest-report/ci.py" ]]; then
            echo "::error::Pytest execution evidence unavailable; bundle export did not complete"
            exit 1
          fi
          python3 "$RUNNER_TEMP/pytest-report/ci.py" gate "$RUNNER_TEMP/pytest-report"

      - name: Publish pytest Job Summary
        id: pytest_summary
        if: ${{ always() && !cancelled() && inputs.pytest_report_function != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/pytest-report/ci.py" ]]; then
            printf '## Pytest Results — UNAVAILABLE\n\nExecution evidence unavailable; bundle export failed. See execution logs.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 "$RUNNER_TEMP/pytest-report/ci.py" summary \
            "$RUNNER_TEMP/pytest-report" "$GITHUB_STEP_SUMMARY"

      - name: Explain pytest report delivery warning
        if: ${{ always() && !cancelled() && steps.pytest_summary.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "::warning::Pytest report delivery was unavailable; original execution gate remains authoritative"
          printf '\nReport delivery warning: evidence or presentation is incomplete. Original pytest execution status is unchanged.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest evidence
        if: ${{ always() && !cancelled() && inputs.pytest_report_function != '' }}
        uses: actions/upload-artifact@v7.0.2
        continue-on-error: true
        with:
          name: ${{ inputs.pytest_artifact_name }}
          path: |
            ${{ runner.temp }}/pytest-report/report.json
            ${{ runner.temp }}/pytest-report/exit-code.txt
            ${{ runner.temp }}/pytest-report/summary.md
            ${{ runner.temp }}/pytest-report/junit.xml
            ${{ runner.temp }}/pytest-report/fixture-invocations.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Ruff rejection and recovery (smoke only)
        if: ${{ inputs.verify_failure_propagation }}
        shell: bash
        env:
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: docker-container://dagger-engine
        run: |
          set -euo pipefail

          probe="tests/ruff_negative_probe.py"
          log="$RUNNER_TEMP/dagger-ruff-negative.log"

          if [[ ! -d tests || -e "$probe" ]]; then
            echo "::error::Smoke test directory missing or probe already exists"
            exit 1
          fi

          cleanup() {
            rm -f -- "$probe"
          }
          trap cleanup EXIT

          # Do not commit intentionally invalid code to Git.
          printf 'import os\n' > "$probe"

          status=0
          dagger check lint > "$log" 2>&1 || status=$?

          if [[ "$status" -eq 0 ]]; then
            echo "::error::Ruff negative probe was incorrectly accepted"
            exit 1
          fi
          if ! grep -q 'F401' "$log" || ! grep -q 'ruff_negative_probe.py' "$log"; then
            echo "::error::Dagger failed, but not because of the expected Ruff F401 probe"
            tail -n 35 "$log"
            exit 1
          fi

          echo "PASS: Dagger rejected the injected Ruff F401"
          cleanup
          trap - EXIT

          # The same checkout must be healthy again after removing the probe.
          dagger check
          echo "PASS: All checks recovered after probe cleanup"

      - name: Engine logs on failure
        if: failure()
        run: docker logs --tail 100 dagger-engine || true

      - name: Cleanup temporary Git credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/engineering-ci-git-credentials"
