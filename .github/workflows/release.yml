name: Release engineering-ci

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact repository version, e.g. v0.4.11'
        type: string
        required: true
      publish:
        description: 'Create Tag and Release after complete verification (main only)'
        type: boolean
        default: false
      pytest_scenario:
        description: 'Validation-only failure probe; publication requires pass'
        type: choice
        default: pass
        options: [pass, assertion]

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

concurrency:
  group: engineering-ci-manual-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate manual release request
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_SCENARIO: ${{ inputs.pytest_scenario }}
        run: python3 -m engineering_ci.workflow_actions release prepare

  core-tests:
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      coverage: true

  complete-ci:
    needs: candidate
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      # One report execution replaces only this exact check; all other checks run.
      pytest_report_function: fixture-pytest-artifacts
      pytest_check: engineering-ci:fixture-test
      pytest_report_scenario: ${{ inputs.pytest_scenario }}
      dependency_security_mode: enforce
      dependency_security_project: .
      dependency_security_public_indexes: https://mirrors.aliyun.com/pypi/simple
      dependency_security_source_ref: ${{ github.sha }}
      verify_module_lock: true

  evidence:
    outputs:
      facts_artifact_id: ${{ steps.facts_artifact.outputs.artifact-id }}
    needs: [candidate, core-tests, complete-ci]
    if: ${{ always() && !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - name: Require exact native Artifact IDs
        env:
          PYTEST_ID: ${{ needs.complete-ci.outputs.pytest_artifact_id }}
          SECURITY_ID: ${{ needs.complete-ci.outputs.security_artifact_id }}
          CORE_ID: ${{ needs.core-tests.outputs.core_artifact_id }}
          RUFF_ID: ${{ needs.core-tests.outputs.ruff_artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact_id in "$PYTEST_ID" "$SECURITY_ID" "$CORE_ID" "$RUFF_ID"; do
            if [[ ! "$artifact_id" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Required native Artifact ID unavailable"
              exit 1
            fi
          done
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.complete-ci.outputs.pytest_artifact_id }}
          path: .release-evidence/pytest
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.complete-ci.outputs.security_artifact_id }}
          path: .release-evidence/security
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.core-tests.outputs.core_artifact_id }}
          path: .release-evidence/core
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.core-tests.outputs.ruff_artifact_id }}
          path: .release-evidence/ruff
      - name: Require usable evidence and original execution gates
        run: python3 -m engineering_ci.workflow_actions manifest facts --directory .release-evidence --output release-facts/facts.json
      - uses: actions/upload-artifact@v7.0.2
        id: facts_artifact
        with:
          name: release-facts
          path: release-facts/facts.json
          if-no-files-found: error
          retention-days: 7

  verified:
    outputs:
      manifest_artifact_id: ${{ steps.manifest_artifact.outputs.artifact-id }}
    needs: [candidate, core-tests, complete-ci, evidence]
    if: ${{ always() && !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        if: ${{ needs.evidence.outputs.facts_artifact_id != '' }}
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.evidence.outputs.facts_artifact_id }}
          path: release-facts
      - name: Require every validation job and exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_SCENARIO: ${{ inputs.pytest_scenario }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m engineering_ci.workflow_actions release verify --directory release-facts --manifest release-manifest.json
      - name: Preserve validation Manifest
        id: manifest_artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [candidate, verified]
    if: ${{ inputs.publish && needs.verified.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        name: Download exact verified Manifest
        if: ${{ needs.verified.outputs.manifest_artifact_id != '' }}
        with:
          artifact-ids: ${{ needs.verified.outputs.manifest_artifact_id }}
          path: release-evidence
      - name: Recheck main and publish immutable tag and evidenced GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_SCENARIO: ${{ inputs.pytest_scenario }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: python3 -m engineering_ci.workflow_actions release publish --manifest release-evidence/release-manifest.json
      - name: Preserve publication evidence after an API failure
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-publication-evidence
          path: release-evidence/release-manifest.json
          if-no-files-found: error
          retention-days: 30
