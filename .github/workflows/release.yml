name: Release engineering-ci

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact repository version, e.g. v0.4.8'
        type: string
        required: true
      publish:
        description: 'Create Tag and Release after complete verification (main only)'
        type: boolean
        default: false
      pytest_scenario:
        description: 'Validation-only failure probe; publication requires pass'
        type: choice
        default: pass
        options: [pass, assertion]

permissions:
  contents: read

concurrency:
  group: engineering-ci-manual-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate manual release request
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_SCENARIO: ${{ inputs.pytest_scenario }}
        run: python3 scripts/manual_release.py prepare

  core-tests:
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      coverage: true

  complete-ci:
    needs: candidate
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      # One report execution replaces only this exact check; all other checks run.
      pytest_report_function: fixture-pytest-artifacts
      pytest_check: engineering-ci:fixture-test
      pytest_report_scenario: ${{ inputs.pytest_scenario }}
      dependency_security_mode: enforce
      dependency_security_project: .
      dependency_security_public_indexes: https://mirrors.aliyun.com/pypi/simple
      dependency_security_source_ref: ${{ github.sha }}
      verify_module_lock: true

  evidence:
    needs: [candidate, core-tests, complete-ci]
    if: ${{ always() && !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: pytest-report
          path: .release-evidence/pytest
      - uses: actions/download-artifact@v5
        with:
          name: dependency-security
          path: .release-evidence/security
      - uses: actions/download-artifact@v5
        with:
          name: core-tests
          path: .release-evidence/core
      - name: Require usable evidence and original execution gates
        run: python3 scripts/manual_release.py evidence --directory .release-evidence

  verified:
    needs: [candidate, core-tests, complete-ci, evidence]
    if: ${{ always() && !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - name: Require every validation job and exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_SCENARIO: ${{ inputs.pytest_scenario }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/manual_release.py verify

  publish:
    needs: [candidate, verified]
    if: ${{ inputs.publish && needs.verified.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - name: Recheck main and publish immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_SCENARIO: ${{ inputs.pytest_scenario }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/manual_release.py publish
