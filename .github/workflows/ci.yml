name: Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      coverage:
        description: 'Export core test coverage during manual release validation'
        type: boolean
        default: false
    outputs:
      core_artifact_id:
        value: ${{ jobs.sync-tool-tests.outputs.artifact_id }}
      ruff_artifact_id:
        value: ${{ jobs.python-ci.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  python-ci:
    name: python-ci / checks
    outputs:
      artifact_id: ${{ steps.ruff_artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dagger-module.toml", "rb"))["engineVersion"].removeprefix("v"))')"
          curl -fsSL https://dl.dagger.io/dagger/install.sh -o "$RUNNER_TEMP/install-dagger.sh"
          BIN_DIR="$RUNNER_TEMP/dagger-bin" sh "$RUNNER_TEMP/install-dagger.sh"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
      - name: Ruff Lint
        run: dagger check --engineering-ci --check=lint
      - name: Ruff Format Check
        run: dagger check --engineering-ci --check=format-check
      - name: Record release Ruff tool versions
        if: ${{ inputs.coverage }}
        run: dagger api call repository-ruff-tools export --path release-tools/tool-versions.json
      - uses: actions/upload-artifact@v7.0.2
        id: ruff_artifact
        if: ${{ inputs.coverage }}
        with:
          name: release-tools-ruff
          path: release-tools/tool-versions.json
          if-no-files-found: error
          retention-days: 7

  sync-tool-tests:
    outputs:
      artifact_id: ${{ steps.core_artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dagger-module.toml", "rb"))["engineVersion"].removeprefix("v"))')"
          curl -fsSL https://dl.dagger.io/dagger/install.sh -o "$RUNNER_TEMP/install-dagger.sh"
          BIN_DIR="$RUNNER_TEMP/dagger-bin" sh "$RUNNER_TEMP/install-dagger.sh"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
      - name: Run all core unit and process tests
        env:
          EXPORT_COVERAGE: ${{ inputs.coverage }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$EXPORT_COVERAGE" == 'true' ]]; then options+=(--env release); fi
          dagger "${options[@]}" check --engineering-ci --check=tests
      - name: Export the original core execution evidence
        if: ${{ always() && !cancelled() && inputs.coverage }}
        run: dagger --env release api call repository-test-artifacts export --path core-evidence
      - name: Upload core release evidence
        id: core_artifact
        if: ${{ always() && inputs.coverage }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-tests
          path: |
            core-evidence/core-junit.xml
            core-evidence/core-coverage.xml
            core-evidence/core-coverage.json
            core-evidence/tool-versions.json
          if-no-files-found: error
          retention-days: 7

  version-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dagger-module.toml", "rb"))["engineVersion"].removeprefix("v"))')"
          curl -fsSL https://dl.dagger.io/dagger/install.sh -o "$RUNNER_TEMP/install-dagger.sh"
          BIN_DIR="$RUNNER_TEMP/dagger-bin" sh "$RUNNER_TEMP/install-dagger.sh"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
      - name: Validate release metadata and root lock consistency
        run: dagger check --engineering-ci --check=version --check=lock

  # ECI #87 A: the pinned Engine exports its own Spans when its config file
  # enables telemetry.workloadExport and the OTLP environment names an
  # endpoint. This Job runs a real native Check, lets the Engine export, and
  # records what an actual receiver captured. The receipt is the evidence; a
  # missing capture fails the Job instead of being reported as observed.
  dagger-native-telemetry:
    name: dagger-native-telemetry / native trace capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dagger-module.toml", "rb"))["engineVersion"].removeprefix("v"))')"
          curl -fsSL https://dl.dagger.io/dagger/install.sh -o "$RUNNER_TEMP/install-dagger.sh"
          BIN_DIR="$RUNNER_TEMP/dagger-bin" sh "$RUNNER_TEMP/install-dagger.sh"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
      - name: Install uv
        uses: astral-sh/setup-uv@v6.1.0
        with:
          enable-cache: true
      - name: Start the OTLP receiver
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          mkdir -p artifacts/dagger-native-telemetry
          # The receiver binds the Docker bridge address: the Engine container
          # reaches the host there, and no wildcard address is exposed.
          BRIDGE="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"
          printf '%s\n' "${BRIDGE}" > artifacts/dagger-native-telemetry/receiver-address.txt
          nohup .venv/bin/python .github/scripts/otlp_http_receiver.py \
            --host "${BRIDGE}" \
            --port 4318 \
            --output artifacts/dagger-native-telemetry/capture.json \
            > artifacts/dagger-native-telemetry/receiver.log 2>&1 &
          echo $! > artifacts/dagger-native-telemetry/receiver.pid
          for _ in $(seq 1 60); do
            if curl -fsS "http://${BRIDGE}:4318/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "the OTLP receiver did not become ready" >&2
          exit 1
      - name: Start the Dagger Engine with the native workload export
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dagger-module.toml", "rb"))["engineVersion"].removeprefix("v"))')"
          BRIDGE="$(cat artifacts/dagger-native-telemetry/receiver-address.txt)"
          printf '%s\n' '{"telemetry": {"workloadExport": true}}' > "$RUNNER_TEMP/engine.json"
          printf '%s\n' "http://${BRIDGE}:4318/v1/traces" > artifacts/dagger-native-telemetry/engine-endpoint.txt
          docker volume create dagger-engine-data
          # The workload export needs an endpoint for every signal it exports.
          # A missing one is fatal at engine startup, not a disabled export.
          docker run --pull=missing -d \
            --name dagger-engine \
            --privileged \
            -v dagger-engine-data:/var/lib/dagger \
            -v "$RUNNER_TEMP/engine.json:/etc/dagger/engine.json:ro" \
            -e OTEL_EXPORTER_OTLP_TRACES_ENDPOINT="http://${BRIDGE}:4318/v1/traces" \
            -e OTEL_EXPORTER_OTLP_METRICS_ENDPOINT="http://${BRIDGE}:4318/v1/metrics" \
            -e OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=http/protobuf \
            "registry.dagger.io/engine:v${DAGGER_VERSION}"
      - name: Wait for the Dagger Engine
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_ENGINE=container://dagger-engine
          for _ in $(seq 1 60); do
            if timeout 20 dagger version > artifacts/dagger-native-telemetry/dagger-version.txt 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "the Dagger Engine did not become ready" >&2
          docker logs --tail 100 dagger-engine >&2 || true
          exit 1
      - name: Run a native Dagger check
        shell: bash
        run: |
          set +e
          export DAGGER_ENGINE=container://dagger-engine
          dagger check --engineering-ci --check=lint
          code=$?
          set -e
          # The native result stands on its own; the receipt records it and
          # the Job still fails when the check itself failed.
          printf '%s\n' "${code}" > artifacts/dagger-native-telemetry/check.exit
          printf '%s\n' '{"check": "lint", "exit_code": '"${code}"', "invocation": "dagger check --engineering-ci --check=lint"}' \
            > artifacts/dagger-native-telemetry/native-result.json
          exit 0
      - name: Record the native trace observation
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          BRIDGE="$(cat artifacts/dagger-native-telemetry/receiver-address.txt)"
          # Stop the receiver cleanly and wait for the port, so the next
          # receiver can bind it.
          curl -fsS -X POST "http://${BRIDGE}:4318/stop" > /dev/null 2>&1 || true
          for _ in $(seq 1 30); do
            if ! kill -0 "$(cat artifacts/dagger-native-telemetry/receiver.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$(cat artifacts/dagger-native-telemetry/receiver.pid)" 2>/dev/null || true
          for _ in $(seq 1 30); do
            if [[ -s artifacts/dagger-native-telemetry/capture.json ]]; then break; fi
            sleep 1
          done
          uv run --locked --group dev python -m engineering_ci.dagger_telemetry \
            --capture artifacts/dagger-native-telemetry/capture.json \
            --capture-ref "otlp-http-receiver:4318" \
            --capture-isolated \
            --native-result artifacts/dagger-native-telemetry/native-result.json \
            --engine-config "$RUNNER_TEMP/engine.json" \
            --engine-endpoint "$(cat artifacts/dagger-native-telemetry/engine-endpoint.txt)" \
            --engine-protocol http/protobuf \
            --check-name lint \
            --invocation-ref "dagger check --engineering-ci --check=lint" \
            --source-binding-ref "git-tree:$(git rev-parse HEAD^{tree})" \
            --output artifacts/dagger-native-telemetry/receipt.json \
            --json > artifacts/dagger-native-telemetry/receipt.stdout.json
          receipt_code=$?
          set -e
          printf '%s\n' "${receipt_code}" > artifacts/dagger-native-telemetry/receipt.exit
          check_code="$(cat artifacts/dagger-native-telemetry/check.exit 2>/dev/null || echo 1)"
          if [[ "${check_code}" != "0" ]]; then
            echo "the native Dagger check failed with exit ${check_code}" >&2
            exit "${check_code}"
          fi
          exit "${receipt_code}"
      - name: Start the OTLP receiver for the failing check
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE="$(cat artifacts/dagger-native-telemetry/receiver-address.txt)"
          nohup .venv/bin/python .github/scripts/otlp_http_receiver.py \
            --host "${BRIDGE}" \
            --port 4318 \
            --output artifacts/dagger-native-telemetry/capture-negative.json \
            > artifacts/dagger-native-telemetry/receiver-negative.log 2>&1 &
          echo $! > artifacts/dagger-native-telemetry/receiver-negative.pid
          for _ in $(seq 1 60); do
            if curl -fsS "http://${BRIDGE}:4318/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          # The supplementary failing Check must not block the Job; the
          # outcome is recorded instead.
          echo "the OTLP receiver for the failing check did not become ready" >&2
          printf '%s\n' '{"receiver": "not_ready"}' \
            > artifacts/dagger-native-telemetry/negative-receiver.json
          exit 0
      - name: Run a native Dagger check that fails
        shell: bash
        run: |
          set +e
          export DAGGER_ENGINE=container://dagger-engine
          # A real failing native Check: the association must survive the
          # failure and the failure must not be masked by the trace.
          printf '%s\n' 'import os' > eci_lint_negative.py
          dagger check --engineering-ci --check=lint
          code=$?
          set -e
          rm -f eci_lint_negative.py
          printf '%s\n' "${code}" > artifacts/dagger-native-telemetry/negative-check.exit
          printf '%s\n' '{"check": "lint", "exit_code": '"${code}"', "invocation": "dagger check --engineering-ci --check=lint (negative)"}' \
            > artifacts/dagger-native-telemetry/native-result-negative.json
          if [[ "${code}" == "0" ]]; then
            echo "the negative check was expected to fail" >&2
            exit 1
          fi
          exit 0
      - name: Record the failing native observation
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          BRIDGE="$(cat artifacts/dagger-native-telemetry/receiver-address.txt)"
          curl -fsS -X POST "http://${BRIDGE}:4318/stop" > /dev/null 2>&1 || true
          for _ in $(seq 1 30); do
            if ! kill -0 "$(cat artifacts/dagger-native-telemetry/receiver-negative.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$(cat artifacts/dagger-native-telemetry/receiver-negative.pid)" 2>/dev/null || true
          for _ in $(seq 1 30); do
            if [[ -s artifacts/dagger-native-telemetry/capture-negative.json ]]; then break; fi
            sleep 1
          done
          uv run --locked --group dev python -m engineering_ci.dagger_telemetry \
            --capture artifacts/dagger-native-telemetry/capture-negative.json \
            --capture-ref "otlp-http-receiver:4318 (negative)" \
            --capture-isolated \
            --native-result artifacts/dagger-native-telemetry/native-result-negative.json \
            --engine-config "$RUNNER_TEMP/engine.json" \
            --engine-endpoint "$(cat artifacts/dagger-native-telemetry/engine-endpoint.txt)" \
            --engine-protocol http/protobuf \
            --check-name lint \
            --invocation-ref "dagger check --engineering-ci --check=lint (negative)" \
            --source-binding-ref "git-tree:$(git rev-parse HEAD^{tree})" \
            --output artifacts/dagger-native-telemetry/receipt-negative.json \
            --json > artifacts/dagger-native-telemetry/receipt-negative.stdout.json
          code=$?
          set -e
          printf '%s\n' "${code}" > artifacts/dagger-native-telemetry/receipt-negative.exit
          # The supplementary capture never fails the Job; its exit code and
          # the receiver state are recorded in the artifacts.
          exit 0
      - name: Start the OTLP receiver for the entry points
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE="$(cat artifacts/dagger-native-telemetry/receiver-address.txt)"
          nohup .venv/bin/python .github/scripts/otlp_http_receiver.py \
            --host "${BRIDGE}" \
            --port 4318 \
            --output artifacts/dagger-native-telemetry/capture-entrypoints.json \
            > artifacts/dagger-native-telemetry/receiver-entrypoints.log 2>&1 &
          echo $! > artifacts/dagger-native-telemetry/receiver-entrypoints.pid
          for _ in $(seq 1 60); do
            if curl -fsS "http://${BRIDGE}:4318/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "the OTLP receiver for the entry points did not become ready" >&2
          exit 0
      - name: Run the standalone Report and Artifact Function
        shell: bash
        run: |
          set +e
          export DAGGER_ENGINE=container://dagger-engine
          mkdir -p artifacts/dagger-native-telemetry/entrypoints
          # A standalone Report/Artifact Function: its native result is an
          # artifact, not a Check. The Plan driven entry point is not run in
          # this Workflow on purpose: the repository keeps ad-hoc function
          # invocations out of the PR Workflow
          # (tests/test_manual_release.py::test_workflow_triggers_and_privileges).
          dagger api call repository-ruff-tools export \
            --path artifacts/dagger-native-telemetry/entrypoints/ruff-tools
          artifact_code=$?
          set -e
          printf '%s\n' "${artifact_code}" > artifacts/dagger-native-telemetry/entrypoints/artifact.exit
          exit 0
      - name: Record the entry point observation
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          BRIDGE="$(cat artifacts/dagger-native-telemetry/receiver-address.txt)"
          curl -fsS -X POST "http://${BRIDGE}:4318/stop" > /dev/null 2>&1 || true
          for _ in $(seq 1 30); do
            if ! kill -0 "$(cat artifacts/dagger-native-telemetry/receiver-entrypoints.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$(cat artifacts/dagger-native-telemetry/receiver-entrypoints.pid)" 2>/dev/null || true
          for _ in $(seq 1 30); do
            if [[ -s artifacts/dagger-native-telemetry/capture-entrypoints.json ]]; then break; fi
            sleep 1
          done
          uv run --locked --group dev python -m engineering_ci.dagger_telemetry \
            --capture artifacts/dagger-native-telemetry/capture-entrypoints.json \
            --capture-ref "otlp-http-receiver:4318 (entry points)" \
            --capture-isolated \
            --engine-config "$RUNNER_TEMP/engine.json" \
            --engine-endpoint "$(cat artifacts/dagger-native-telemetry/engine-endpoint.txt)" \
            --engine-protocol http/protobuf \
            --function-name repository-ruff-tools \
            --invocation-ref "dagger api call repository-ruff-tools export" \
            --source-binding-ref "git-tree:$(git rev-parse HEAD^{tree})" \
            --output artifacts/dagger-native-telemetry/receipt-entrypoints.json \
            --json > artifacts/dagger-native-telemetry/receipt-entrypoints.stdout.json
          code=$?
          set -e
          printf '%s\n' "${code}" > artifacts/dagger-native-telemetry/receipt-entrypoints.exit
          exit 0
      - name: Verify native A.1 invocation and result correlation
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          # The recorder can return zero for a partial candidate. This
          # independent gate checks real raw parent chains and original
          # native results. Deliberate Ruff F401 is the EXPECTED negative.
          uv run --locked --group dev python \
            .github/scripts/assert_dagger_native_a1.py \
            artifacts/dagger-native-telemetry
      - name: Collect the Engine and receiver logs
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          docker logs --tail 200 dagger-engine > artifacts/dagger-native-telemetry/engine.log 2>&1
          docker ps -a --filter name=dagger-engine >> artifacts/dagger-native-telemetry/engine.log 2>&1
          tail -200 artifacts/dagger-native-telemetry/receiver.log >> artifacts/dagger-native-telemetry/engine.log 2>&1
          exit 0
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: dagger-native-telemetry
          path: artifacts/dagger-native-telemetry/
          if-no-files-found: warn
          retention-days: 7
