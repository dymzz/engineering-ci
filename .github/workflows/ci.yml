name: Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pytest_probe_scenario:
        description: 'Run a real pytest report delivery probe (failures are intentional)'
        type: choice
        default: pass
        options:
          - pass
          - assertion
          - missing-xml
          - invalid-xml
          - missing-xml-pass

permissions:
  contents: read

jobs:
  python-ci:
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      pytest_report_function: fixture-pytest-artifacts
      pytest_check: engineering-ci:fixture-test

  pytest-report-probe:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      pytest_report_function: fixture-pytest-artifacts
      pytest_check: engineering-ci:fixture-test
      pytest_report_scenario: ${{ inputs.pytest_probe_scenario }}
      pytest_artifact_name: pytest-report-probe

  sync-tool-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test consumer sync utility
        run: python3 -m unittest discover -s tests -p 'test_sync_consumer.py' -v
      - uses: astral-sh/setup-uv@v7
      - name: Test pytest report parser
        run: uv run --locked --group dev python -m unittest discover -s tests -p 'test_pytest*.py' -v

  version-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Validate release metadata and lock files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_version.py check
          python3 -m unittest discover -s tests -p 'test_release_version.py' -v
          uv lock --project . --check
