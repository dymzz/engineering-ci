name: Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pytest_probe_scenario:
        description: 'Run a real pytest report delivery probe (failures are intentional)'
        type: choice
        default: pass
        options:
          - pass
          - assertion
          - missing-xml
          - invalid-xml
          - missing-xml-pass
      quality_probe_scenario:
        description: 'Opt-in real pytest coverage quality probe (failures intentional)'
        type: choice
        default: 'off'
        options:
          - 'off'
          - baseline
          - coverage-pass
          - coverage-low
          - coverage-test-fail
          - coverage-both-fail
          - markers
          - markers-empty
          - invalid-markers
          - coverage-missing-dependency
          - coverage-report-missing
          - coverage-report-invalid
          - coverage-source-missing
          - invalid-path
          - invalid-threshold
      matrix_probe_scenario:
        description: 'Explicit Python compatibility matrix probe (negative cases intentionally fail)'
        type: choice
        default: 'off'
        options:
          - 'off'
          - pass
          - version-fail
          - unsupported
          - coverage-low
          - dependency-error
          - performance

permissions:
  contents: read

jobs:
  python-ci:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.matrix_probe_scenario == 'off' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      pytest_report_function: fixture-pytest-artifacts
      pytest_check: engineering-ci:fixture-test
      dependency_security_mode: report
      dependency_security_project: tests/fixtures/dependency-security
      dependency_security_source_ref: ${{ github.sha }}

  pytest-report-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.quality_probe_scenario == 'off' && inputs.matrix_probe_scenario == 'off' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      pytest_report_function: fixture-pytest-artifacts
      pytest_check: engineering-ci:fixture-test
      pytest_report_scenario: ${{ inputs.pytest_probe_scenario }}
      pytest_artifact_name: pytest-report-probe

  quality-gate-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.quality_probe_scenario != 'off' && inputs.matrix_probe_scenario == 'off' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      pytest_report_function: fixture-quality-artifacts
      pytest_check: engineering-ci:fixture-quality-gates
      pytest_report_scenario: ${{ inputs.quality_probe_scenario }}
      pytest_artifact_name: pytest-quality-probe
  matrix-gate-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.matrix_probe_scenario != 'off' }}
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      pytest_report_function: fixture-matrix-artifacts
      pytest_check: engineering-ci:fixture-python-matrix
      pytest_report_scenario: ${{ inputs.matrix_probe_scenario }}
      pytest_artifact_name: pytest-matrix-probe

  sync-tool-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test consumer sync utility
        run: python3 -m unittest discover -s tests -p 'test_sync_consumer.py' -v
      - uses: astral-sh/setup-uv@v7
      - name: Test pytest report parser
        run: uv run --locked --group dev python -m unittest discover -s tests -p 'test_pytest*.py' -v

      - name: Test dependency security contract
        run: uv run --locked --group dev pytest tests/test_dependency_security.py -q

  version-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Validate release metadata and lock files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_version.py check
          python3 -m unittest discover -s tests -p 'test_release_version.py' -v
          uv lock --project . --check
