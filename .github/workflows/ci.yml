name: Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      coverage:
        description: 'Export core test coverage during manual release validation'
        type: boolean
        default: false
    outputs:
      core_artifact_id:
        value: ${{ jobs.sync-tool-tests.outputs.artifact_id }}
      ruff_artifact_id:
        value: ${{ jobs.python-ci.outputs.artifact_id }}
      powershell_artifact_id:
        value: ${{ jobs.powershell-analysis.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  python-ci:
    name: python-ci / checks
    outputs:
      artifact_id: ${{ steps.ruff_artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dagger-module.toml", "rb"))["engineVersion"].removeprefix("v"))')"
          curl -fsSL https://dl.dagger.io/dagger/install.sh -o "$RUNNER_TEMP/install-dagger.sh"
          BIN_DIR="$RUNNER_TEMP/dagger-bin" sh "$RUNNER_TEMP/install-dagger.sh"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
      - name: Ruff Lint
        run: dagger check --engineering-ci --check=lint
      - name: Ruff Format Check
        run: dagger check --engineering-ci --check=format-check
      - name: Workflow analysis
        run: dagger check --engineering-ci --check=workflow-analysis
      - name: Record release Ruff tool versions
        if: ${{ inputs.coverage }}
        run: dagger api call repository-ruff-tools export --path release-tools/tool-versions.json
      - uses: actions/upload-artifact@v7.0.2
        id: ruff_artifact
        if: ${{ inputs.coverage }}
        with:
          name: release-tools-ruff
          path: release-tools/tool-versions.json
          if-no-files-found: error
          retention-days: 7

  sync-tool-tests:
    outputs:
      artifact_id: ${{ steps.core_artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dagger-module.toml", "rb"))["engineVersion"].removeprefix("v"))')"
          curl -fsSL https://dl.dagger.io/dagger/install.sh -o "$RUNNER_TEMP/install-dagger.sh"
          BIN_DIR="$RUNNER_TEMP/dagger-bin" sh "$RUNNER_TEMP/install-dagger.sh"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
      - name: Run all core unit and process tests
        env:
          EXPORT_COVERAGE: ${{ inputs.coverage }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$EXPORT_COVERAGE" == 'true' ]]; then options+=(--env release); fi
          dagger "${options[@]}" check --engineering-ci --check=tests
      - name: Export the original core execution evidence
        if: ${{ always() && !cancelled() && inputs.coverage }}
        run: dagger --env release api call repository-test-artifacts export --path core-evidence
      - name: Upload core release evidence
        id: core_artifact
        if: ${{ always() && inputs.coverage }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-tests
          path: |
            core-evidence/core-junit.xml
            core-evidence/core-coverage.xml
            core-evidence/core-coverage.json
            core-evidence/tool-versions.json
          if-no-files-found: error
          retention-days: 7

  # PSScriptAnalyzer runs on a Windows runner rather than inside the Linux
  # Dagger container: its rules and the environment they depend on are
  # PowerShell-specific, and a Windows job is the only place reporting them
  # as analysed would be honest. The repository is its own helper here, so
  # no second checkout and no duplicate execution is needed.
  powershell-analysis:
    outputs:
      artifact_id: ${{ steps.powershell_artifact.outputs.artifact-id }}
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Analyse PowerShell scripts
        shell: pwsh
        env:
          POWERSHELL_PATHS: '.dagger/src/engineering_ci,config'
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @(
            'powershell',
            '--workspace', $env:GITHUB_WORKSPACE,
            '--helper-root', $env:GITHUB_WORKSPACE,
            '--paths', $env:POWERSHELL_PATHS,
            '--mode', 'enforce',
            '--out', (Join-Path $env:RUNNER_TEMP 'powershell-analysis')
          )
          uv run --python 3.14 --no-project python -m engineering_ci.workflow_actions @arguments
      - name: Publish PowerShell Analysis Summary
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $summary = Join-Path $env:RUNNER_TEMP 'powershell-analysis/summary.md'
          if (Test-Path $summary) {
            Get-Content -LiteralPath $summary -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            '## PowerShell Analysis Summary' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            'Evidence unavailable; see the failed setup or execution step. No pass is established.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
      - name: Upload PowerShell evidence
        id: powershell_artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        continue-on-error: true
        with:
          name: powershell-analysis
          path: |
            ${{ runner.temp }}/powershell-analysis/report.json
            ${{ runner.temp }}/powershell-analysis/summary.md
          if-no-files-found: error
          retention-days: 7

  version-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Dagger CLI
        shell: bash
        run: |
          set -euo pipefail
          export DAGGER_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("dagger-module.toml", "rb"))["engineVersion"].removeprefix("v"))')"
          curl -fsSL https://dl.dagger.io/dagger/install.sh -o "$RUNNER_TEMP/install-dagger.sh"
          BIN_DIR="$RUNNER_TEMP/dagger-bin" sh "$RUNNER_TEMP/install-dagger.sh"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"
      - name: Validate release metadata and root lock consistency
        run: dagger check --engineering-ci --check=version --check=lock
