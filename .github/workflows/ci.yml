name: Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      coverage:
        description: 'Export core test coverage during manual release validation'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python-ci:
    # Keep the former reusable Dagger status name for PR review.
    name: python-ci / checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
      - name: Ruff Lint
        run: >-
          uvx ruff==0.16.10 check --isolated --target-version py311
          tests/fixtures/python-app scripts/release_version.py
          scripts/manual_release.py tests/test_release_version.py
          tests/test_manual_release.py scripts/release_manifest.py tests/test_release_manifest.py
      - name: Ruff Format Check
        run: >-
          uvx ruff==0.16.10 format --isolated --target-version py311 --check
          tests/fixtures/python-app scripts/release_version.py
          scripts/manual_release.py tests/test_release_version.py
          tests/test_manual_release.py scripts/release_manifest.py tests/test_release_manifest.py
      - name: Record release Ruff tool versions
        if: ${{ inputs.coverage }}
        run: python3 scripts/release_manifest.py tools --scope ruff --output release-tools/tool-versions.json
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ inputs.coverage }}
        with:
          name: release-tools-ruff
          path: release-tools/tool-versions.json
          if-no-files-found: error
          retention-days: 7

  sync-tool-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.14'
      - name: Install existing HTTP integration test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq aria2
      - name: Run all core unit and process tests
        shell: bash
        env:
          EXPORT_COVERAGE: ${{ inputs.coverage }}
        run: |
          set -euo pipefail
          args=(-q --junitxml=core-junit.xml)
          if [[ "$EXPORT_COVERAGE" == 'true' ]]; then
            # No new threshold: existing Dagger quality policy remains authoritative.
            args+=(--cov=src/engineering_ci --cov=.dagger/src/engineering_ci
              --cov-report=xml:core-coverage.xml --cov-report=json:core-coverage.json)
          fi
          uv run --locked --group dev pytest "${args[@]}"
      - name: Record core release tool versions
        if: ${{ always() && !cancelled() && inputs.coverage }}
        run: uv run --no-sync --group dev python scripts/release_manifest.py tools --scope core --output tool-versions.json
      - name: Upload core release evidence
        if: ${{ always() && inputs.coverage }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-tests
          path: |
            core-junit.xml
            core-coverage.xml
            core-coverage.json
            tool-versions.json
          if-no-files-found: error
          retention-days: 7

  version-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.14'
      - name: Validate release metadata and root lock consistency
        run: |
          python3 scripts/release_version.py check
          uv lock --project . --check
