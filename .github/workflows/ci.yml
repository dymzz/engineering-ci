name: Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      ENGINEERING_CI_READ_TOKEN:
        required: true
    inputs:
      coverage:
        description: 'Export core test coverage during manual release validation'
        type: boolean
        default: false
    outputs:
      core_artifact_id:
        value: ${{ jobs.sync-tool-tests.outputs.artifact_id }}
      ruff_artifact_id:
        value: ${{ jobs.python-ci.outputs.artifact_id }}

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  python-ci:
    # Keep the former reusable Dagger status name for PR review.
    name: python-ci / checks
    outputs:
      artifact_id: ${{ steps.ruff_artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read unified toolchain
        id: check_toolchain
        run: python3 -m engineering_ci.workflow_actions checks toolchain --github-output "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.check_toolchain.outputs.uv_version }}
      - name: Ruff Lint
        run: python3 -m engineering_ci.workflow_actions checks ruff-lint
      - name: Ruff Format Check
        run: python3 -m engineering_ci.workflow_actions checks ruff-format
      - name: Record release Ruff tool versions
        if: ${{ inputs.coverage }}
        run: python3 -m engineering_ci.workflow_actions manifest tools --scope ruff --output release-tools/tool-versions.json
      - uses: actions/upload-artifact@v7.0.2
        id: ruff_artifact
        if: ${{ inputs.coverage }}
        with:
          name: release-tools-ruff
          path: release-tools/tool-versions.json
          if-no-files-found: error
          retention-days: 7

  sync-tool-tests:
    outputs:
      artifact_id: ${{ steps.core_artifact.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read unified toolchain
        id: check_toolchain
        run: python3 -m engineering_ci.workflow_actions checks toolchain --github-output "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.check_toolchain.outputs.uv_version }}
          python-version: ${{ steps.check_toolchain.outputs.python_version }}
      - name: Install existing HTTP integration test dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq aria2
      - name: Authenticate pinned private Harness dependency
        env:
          GH_TOKEN: ${{ secrets.ENGINEERING_CI_READ_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::ENGINEERING_CI_READ_TOKEN must read the pinned Vesryn repository"
            exit 1
          fi
          gh auth setup-git
          uv sync --locked --group dev
      - name: Run all core unit and process tests
        env:
          EXPORT_COVERAGE: ${{ inputs.coverage }}
        run: python3 -m engineering_ci.workflow_actions checks tests --coverage-from-env
      - name: Record core release tool versions
        if: ${{ always() && !cancelled() && inputs.coverage }}
        run: uv run --no-sync --group dev python -m engineering_ci.workflow_actions manifest tools --scope core --output tool-versions.json
      - name: Upload core release evidence
        id: core_artifact
        if: ${{ always() && inputs.coverage }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: core-tests
          path: |
            core-junit.xml
            core-coverage.xml
            core-coverage.json
            tool-versions.json
          if-no-files-found: error
          retention-days: 7

  version-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read unified toolchain
        id: check_toolchain
        run: python3 -m engineering_ci.workflow_actions checks toolchain --github-output "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ steps.check_toolchain.outputs.uv_version }}
          python-version: ${{ steps.check_toolchain.outputs.python_version }}
      - name: Validate release metadata and root lock consistency
        run: python3 -m engineering_ci.workflow_actions checks version lock
