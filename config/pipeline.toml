# Shared local / PR checks. GitHub Actions owns the remote release DAG.
schema_version = 1

[toolchain]
uv = "0.12.23"
ruff = "0.16.10"
python = "3.14"

[arguments]
ruff_target = "py311"
pytest = ["-q"]

[profiles]
pr = ["ruff-lint","ruff-format","pytest","version","lock"]
ruff = ["ruff-lint","ruff-format"]
tests = ["pytest"]

# Windows uses Linux containers; Linux CI keeps its existing native execution.
[execution]
backend = "auto"

[delivery]
checks_profile = "pr"

[delivery.release]
workflow = "release.yml"
branch = "main"
trigger = "manual"

[inputs]
common = [".dagger/sdk",".dagger/src/engineering_ci/main.py","dagger-module.toml","dagger.toml","src/engineering_ci/__init__.py","src/engineering_ci/checks.py","src/engineering_ci/check_operations.py","src/engineering_ci/dagger_checks.py","src/engineering_ci/task_observation.py","src/engineering_ci/checks_container.py",".dagger/src/engineering_ci/pr_checks.py","src/engineering_ci/toolchain.py","src/engineering_ci/_paths.py","src/engineering_ci/cli/__init__.py","src/engineering_ci/cli/__main__.py","src/engineering_ci/workflow_actions.py",".github/workflows/ci.yml","config/pipeline.toml","src/engineering_ci/pipeline.py","src/engineering_ci/workflow_consistency.py","src/engineering_ci/release/registry.py",".github/workflows/release.yml",".github/workflows/reusable-python-ci.yml"]
release_metadata = ["pyproject.toml","uv.lock",".dagger/pyproject.toml",".dagger/uv.lock"]

[scopes]
ruff = ["tests/fixtures/python-app","scripts/release.py","scripts/download.py","src/engineering_ci/__init__.py","src/engineering_ci/checks.py","src/engineering_ci/check_operations.py","src/engineering_ci/dagger_checks.py","src/engineering_ci/task_observation.py","src/engineering_ci/checks_container.py",".dagger/src/engineering_ci/pr_checks.py","src/engineering_ci/toolchain.py","src/engineering_ci/_paths.py","src/engineering_ci/cli/__init__.py","src/engineering_ci/cli/__main__.py","src/engineering_ci/github_cli.py","src/engineering_ci/workflow_actions.py","src/engineering_ci/cli","src/engineering_ci/release","src/engineering_ci/tools","tests/test_release_version.py","tests/test_manual_release.py","tests/test_release_manifest.py","tests/test_release_transport.py","tests/test_release_verification.py","tests/test_release_delivery.py","tests/test_checks.py","tests/test_dagger_checks.py","tests/test_task_observation.py","tests/test_trace_logging.py","tests/conftest.py","tests/test_pr_check_graph.py","tests/test_unified_cli.py","tests/test_ci_performance.py","tests/test_sync_consumer.py","tests/test_repository_bootstrap.py","tests/test_bootstrap_flow.py","src/engineering_ci/pipeline.py","tests/test_pipeline.py","tests/test_release_lifecycle.py","tests/test_release_recovery.py","src/engineering_ci/workflow_consistency.py","tests/test_workflow_consistency.py","src/engineering_ci/tracing","tests/integration/trace_store.py","src/engineering_ci/mining","tests/integration/trace_projection.py","tests/integration/trace_mining.py","tests/integration/trace_retrieval.py","tests/integration/trace_catalog.py","tests/integration/trace_telemetry.py","tests/integration/trace_jaeger.py","tests/integration/trace_candidates.py","tests/harness_fixtures.py","tests/test_harness_boundary.py","tests/test_handler_bindings.py","src/engineering_ci/workflow_core","src/engineering_ci/workflow_adapters","tests/test_workflow_adapter.py","tests/test_selection_binding.py","tests/test_unified_registry.py","tests/test_workflow_observations.py","tests/integration/workflow_observations.py","tests/test_workflow_event_log.py","tests/integration/workflow_event_log.py","tests/test_workflow_comparison.py","tests/test_workflow_capabilities.py","tests/integration/workflow_feedback.py","tests/test_workflow_feedback_query.py","tests/integration/workflow_feedback_query.py","tests/test_workflow_feedback_summary.py","tests/integration/workflow_feedback_summary.py","tests/test_workflow_feedback_review.py","tests/integration/workflow_feedback_review.py"]
pytest = ["tests","src","scripts",".dagger/src",".python-version",".github/workflows","pyproject.toml","uv.lock","conftest.py","pytest.ini","setup.cfg","tox.ini","uv.toml",".dagger/pyproject.toml",".dagger/uv.lock","dagger-module.toml","dagger.toml","dagger.lock",".dagger/dagger.json","docs/architecture/release/manifest.schema.json","config/ghwf.local.toml","config/tracing.toml"]
version = ["src/engineering_ci/release/version.py","src/engineering_ci/release/__init__.py","pyproject.toml","uv.lock",".dagger/pyproject.toml",".dagger/uv.lock"]
lock = ["pyproject.toml","uv.lock",".python-version","uv.toml"]

[checks.ruff-lint]
scope = "ruff"
required_tools = ["uv","uvx"]
linux_tools = []
optional_backends = []
ci_step = "Ruff Lint"
ci_job = "python-ci / checks"

[checks.ruff-format]
scope = "ruff"
required_tools = ["uv","uvx"]
linux_tools = []
optional_backends = []
ci_step = "Ruff Format Check"
ci_job = "python-ci / checks"

[checks.pytest]
scope = "pytest"
version_only_reuse = true
required_tools = ["uv","git","gh"]
linux_tools = ["bash"]
optional_backends = ["aria2"]
ci_step = "Run all core unit and process tests"
ci_job = "sync-tool-tests"

[checks.version]
scope = "version"
required_tools = ["uv"]
linux_tools = []
optional_backends = []
ci_step = "Validate release metadata and root lock consistency"
ci_job = "version-metadata"

[checks.lock]
scope = "lock"
required_tools = ["uv"]
linux_tools = []
optional_backends = []
ci_step = "Validate release metadata and root lock consistency"
ci_job = "version-metadata"

[optional_backends.aria2]
tool = "aria2c"
junit_property = "engineering_ci.optional_backend"
junit_value = "aria2"
