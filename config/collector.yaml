# Optional local forwarding; PostgreSQL remains the original byte archive.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 200ms
exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    compression: none
    retry_on_failure:
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/jaeger]
