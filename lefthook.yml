min_version: "2.2.2"

# Keep pre-commit read-only and carry pre-push arguments in the native input stream.
lefthook: >-
  sh -c 'set -f; IFS=; case $2 in
  pre-commit) exec uv run --locked --no-sync lefthook run pre-commit --no-stage-fixed ;;
  pre-push) (printf ECI-PRE-PUSH:%s:%s: $(printf %s "$3" | base64 | tr -d [:space:]) $(printf %s "$4" | base64 | tr -d [:space:]); cat) |
  uv run --locked --no-sync lefthook run pre-push ;;
  *) exec uv run --locked --no-sync lefthook $* ;;
  esac' lefthook

pre-commit:
  jobs:
    - name: capture-index
      run: |
        invocation=$(uv run --locked --no-sync python -P -m engineering_ci.cli hooks capture pre-commit) || exit $?
        ECI_HOOK_INVOCATION_REF="$invocation" uv run --locked --no-sync lefthook run pre-commit-checks --no-auto-install --no-stage-fixed || exit $?
        uv run --locked --no-sync python -P -m engineering_ci.cli hooks consume pre-commit --invocation-ref "$invocation"

pre-commit-checks:
  jobs:
    - name: prepare-index-plan
      run: >-
        uv run --locked --no-sync python -P -m engineering_ci.cli hooks prepare pre-commit
        --invocation-ref "$ECI_HOOK_INVOCATION_REF" --dagger-module . --split-checks
    - group:
        parallel: true
        jobs:
          - name: check-index
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-index
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-index
          - name: check-whitespace
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-whitespace
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-whitespace
          - name: check-forwarding
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-forwarding
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-forwarding
          - name: check-docs
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-docs
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-docs
          - name: check-tach
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-tach
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-tach
          - name: check-tach-external
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-tach-external
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-tach-external
          - name: check-vulture
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-vulture
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-vulture
          - name: check-source
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-source
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-source
          - name: check-workflows
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-workflows
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-workflows
          - name: check-tests
            skip:
              - run: >-
                  uv run --locked --no-sync python -P -m engineering_ci.cli hooks skip pre-commit
                  --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-tests
            run: >-
              uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-commit
              --invocation-ref "$ECI_HOOK_INVOCATION_REF" --job check-tests
    - name: reconcile-index
      run: uv run --locked --no-sync python -P -m engineering_ci.cli hooks reconcile pre-commit --invocation-ref "$ECI_HOOK_INVOCATION_REF"

pre-push:
  jobs:
    - name: capture-refs
      use_stdin: true
      # The single config path activates this Job through Lefthook's file template.
      files: printf '%s\n' lefthook.yml
      run: |
        : {files}
        invocation=$(uv run --locked --no-sync python -P -m engineering_ci.cli hooks capture pre-push --framed-stdin) || exit $?
        ECI_HOOK_INVOCATION_REF="$invocation" uv run --locked --no-sync lefthook run pre-push-checks --no-auto-install || exit $?
        uv run --locked --no-sync python -P -m engineering_ci.cli hooks consume pre-push --invocation-ref "$invocation"

pre-push-checks:
  jobs:
    - name: prepare-push-plan
      run: uv run --locked --no-sync python -P -m engineering_ci.cli hooks prepare pre-push --require-plan --invocation-ref "$ECI_HOOK_INVOCATION_REF" --dagger-module .
    - name: check-push
      run: uv run --locked --no-sync python -P -m engineering_ci.cli hooks run pre-push --invocation-ref "$ECI_HOOK_INVOCATION_REF"
    - name: reconcile-push
      run: uv run --locked --no-sync python -P -m engineering_ci.cli hooks reconcile pre-push --invocation-ref "$ECI_HOOK_INVOCATION_REF"

verify:
  parallel: true
  jobs:
    - name: lint
      run: dagger check --engineering-ci --check=lint
    - name: format
      run: dagger check --engineering-ci --check=format-check
    - name: metadata
      run: dagger check --engineering-ci --check=version --check=lock
    - name: core-tests
      run: dagger check --engineering-ci --check=tests
