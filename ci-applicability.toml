# CI check applicability policy for this repository's own GitHub Workflow.
#
# The cumulative change set of a pull request or push decides which existing
# Dagger checks apply. This file does not select pytest targets (#66 Selection),
# admit prior evidence (#63) or create a Required verdict (#61).
#
# ``toolchain`` changes invalidate the tool, dependency or workflow environment
# of every check, so they escalate to all of them. An incomplete or unresolved
# change set always escalates and never skips a check.
schema_version = 1

[toolchain]
files = [
    ".gitattributes",
    ".gitignore",
    ".dagger/pyproject.toml",
    ".dagger/uv.lock",
    "ci-applicability.toml",
    "dagger-module.toml",
    "dagger.lock",
    "dagger.toml",
    "pyproject.toml",
    "uv.lock",
]
prefixes = [".github/workflows/"]

# Paths excluded from the Dagger repository source
# (.dagger/src/engineering_ci_module/repository.py SOURCE_EXCLUDES). The pytest
# check cannot read them inside its container, so a change confined to these
# paths cannot change its result. Markdown under docs/ is excluded; a schema or
# script under docs/ is not and therefore keeps the checks applicable.
[documentation]
files = [
    "AGENTS.md",
    ".dagger/AGENTS.md",
    "scripts/README.md",
    "scripts/rules.md",
]
prefixes = [".agent/", "design/", "guides/"]
markdown_prefixes = ["docs/"]

# Ruff reads Python source, its own configuration and the repository ignores.
[[check]]
name = "lint"
job = "python-ci"
dagger_check = "lint"
suffixes = [".py", ".pyi"]
files = [".ruff.toml", "ruff.toml"]

[[check]]
name = "format-check"
job = "python-ci"
dagger_check = "format-check"
suffixes = [".py", ".pyi"]
files = [".ruff.toml", "ruff.toml"]

# The pytest check reads the Dagger repository source; it is not applicable only
# when every changed path is excluded from that source.
[[check]]
name = "tests"
job = "sync-tool-tests"
dagger_check = "tests"
source_scope = true

# Release metadata and both project locks are validated from these four files.
[[check]]
name = "version"
job = "version-metadata"
dagger_check = "version"
files = ["pyproject.toml", "uv.lock", ".dagger/pyproject.toml", ".dagger/uv.lock"]

[[check]]
name = "lock"
job = "version-metadata"
dagger_check = "lock"
files = ["pyproject.toml", "uv.lock", ".dagger/pyproject.toml", ".dagger/uv.lock"]
