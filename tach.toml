# Module boundaries and dependency graph for Engineering CI (#162 A2).
source_roots = ["src"]
exact = true

root_module = "ignore"
# Circular dependencies remain temporarily allowed across three existing multi-module groups:
# 1. selection <-> expected_checks <-> plan_contract <-> hygiene
# 2. hooks <-> hook_checks <-> dagger_plan
# 3. release.manifest <-> release.publishing
forbid_circular_dependencies = false
exclude = [
    ".dagger/sdk/**",
    ".dagger/.venv/**",
    ".venv/**",
    "tests/**",
    "scripts/**",
    ".git/**",
]

