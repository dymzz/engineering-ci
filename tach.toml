# External dependency boundary:
# - Engineering CI may depend on vesryn-log and vesryn-tool-runtime when adopted,
#   never on vesryn or vesryn-workflow (AGENTS.md Architecture and Ownership).
# - release/publishing.py dynamically loads pytest_ci / pytest_report from
#   .dagger/src/engineering_ci_module at runtime for release evidence checks.
[external]
rename = [
    "opentelemetry:opentelemetry-proto",
    "grpc:grpcio",
    "google:protobuf",
]
exclude = [
    "pytest_ci",
    "pytest_report",
]
