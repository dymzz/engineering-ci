schema_version = 1
tach = "tach.toml"
tests_dir = "tests"
src_root = "src"
framework = "pytest"
# Hygiene plus Workflow/script security (#162 A3). docs/vulture/tach remain later.
# workflow_shellcheck remains in the engine contract/tests but is not enabled in
# this repo's checks/Profiles until Actionlint inline ShellCheck is safe on the
# pinned 1.7.12 wrapper (or #63 wires a PR Source stage that selects it).
checks = [
    "hygiene",
    "actionlint",
    "shellcheck",
    "zizmor",
]
strict_modules = true

escalation_files = [
    ".gitattributes",
    "pyproject.toml",
    "uv.lock",
    "tach.toml",
    "ci-selection.toml",
    "dagger-module.toml",
    "dagger.lock",
    "dagger.toml",
    "lefthook.yml",
    ".dagger/pyproject.toml",
    ".dagger/uv.lock",
    "tests/conftest.py",
]
escalation_prefixes = [".github/workflows/", ".dagger/sdk/"]

ignored_files = [
    "README.md",
    "LICENSE",
    "AGENTS.md",
    ".gitignore",
    ".python-version",
    ".agent/upstream-observations.md",
    ".dagger/AGENTS.md",
    ".dagger/.gitattributes",
    ".dagger/.gitignore",
    "scripts/README.md",
    "scripts/rules.md",
]
ignored_prefixes = ["docs/", "guides/", "design/"]

[check_scope]
docs_suffixes = [".md", ".html"]
code_prefixes = ["src/", "scripts/", "tests/", ".dagger/src/"]
source_prefixes = ["data/", "sources/"]
weaver_prefixes = ["config/github-receiver.weaver.toml", "ci-weaver.toml", ".weaver.toml"]
workflow_prefixes = [".github/workflows/"]
# Independent ShellCheck covers repository scripts only. Workflow inline shell
# stays with Actionlint via workflow_shellcheck (no duplicate scan scope).
shell_prefixes = ["scripts/"]

[workflow_checks]
zizmor_config = ".github/zizmor.yml"
zizmor_offline = true
# Share Actionlint's inline ShellCheck observation with workflow_shellcheck when
# a Profile/stage actually selects that check.
shellcheck_inline = true

[commit]
# Index / pre-commit stays low-cost: hygiene + applicable workflow/script checks.
# Full pytest / Dagger remain on explicit verify / PR / Actions.
select_tests = false

[push]
# New refs compare against the last observed main of the project remote.
new_ref_baseline = "refs/remotes/origin/main"
# Core tests run through the explicit Lefthook verify entrypoint.
select_tests = false
effective_profiles = [
    "config/hook-profiles/create.json",
    "config/hook-profiles/update.json",
    "config/hook-profiles/force-update.json",
    "config/hook-profiles/delete.json",
]

