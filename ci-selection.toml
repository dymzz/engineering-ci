schema_version = 1
framework = "pytest"
checks = ["hygiene"]

[commit]
# Index / pre-commit stays low-cost: hygiene obligations only. Full pytest / Dagger
# remain on explicit verify / PR / Actions. Enabling tests here requires Tach baselines
# and an intentional cost review (#162 A2 / #66).
select_tests = false

[push]
# New refs compare against the last observed main of the project remote.
new_ref_baseline = "refs/remotes/origin/main"
# Core tests run through the explicit Lefthook verify entrypoint.
select_tests = false
effective_profiles = [
    "config/hook-profiles/create.json",
    "config/hook-profiles/update.json",
    "config/hook-profiles/force-update.json",
    "config/hook-profiles/delete.json",
]

# index / pre-commit
[[effective_profile]]
profile_ref = { name = "eci/local-commit", version = "1.0.0" }
profile_revision = "2"
approval_source = "project-governance"
